<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Possessions</title>
<style>
  /* The cutout-on-transparent grid is the product. Everything here exists to
     keep the images the loudest thing on the page: chrome is low-contrast,
     type is small, and the only saturated colour is reserved for a flagged
     field or an essential gap — the two things worth interrupting for. */
  :root {
    --bg: #fbfaf8; --panel: #ffffff; --line: #e6e2dc; --ink: #1b1a18;
    --muted: #77716a; --accent: #b45309; --accent-soft: #fdf3e7;
    --ok: #2f7d55; --warn: #b91c1c; --shadow: 0 1px 2px rgba(0,0,0,.05);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16151a; --panel: #1e1d23; --line: #302e37; --ink: #ece9e4;
      --muted: #9a938c; --accent: #f0a04b; --accent-soft: #2c2318;
      --ok: #5fbf8b; --warn: #f08a8a; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 4px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 20; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0 16px 0 0; font-weight: 650; letter-spacing: -.01em; }
  nav button {
    background: none; border: 0; color: var(--muted); padding: 6px 11px;
    border-radius: 7px; cursor: pointer; font: inherit;
  }
  nav button:hover { background: var(--bg); color: var(--ink); }
  nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  #stats { margin-left: auto; color: var(--muted); font-size: 12px; }
  main { padding: 18px 16px 80px; max-width: 1500px; margin: 0 auto; }

  .row { display: flex; gap: 14px; align-items: flex-start; }
  .rail {
    width: 210px; flex: 0 0 210px; position: sticky; top: 62px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow);
  }
  .rail h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--muted); margin: 14px 0 6px; }
  .rail h3:first-child { margin-top: 0; }
  .grow { flex: 1 1 auto; min-width: 0; }

  select, input[type=text], input[type=number], input[type=date], textarea {
    width: 100%; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 7px; background: var(--bg); color: var(--ink); font: inherit;
  }
  textarea { resize: vertical; min-height: 52px; }
  label { display: block; font-size: 11px; color: var(--muted); margin: 8px 0 3px;
          text-transform: uppercase; letter-spacing: .05em; }
  button.action {
    background: var(--accent); color: #fff; border: 0; padding: 7px 13px;
    border-radius: 7px; cursor: pointer; font: inherit; font-weight: 600;
  }
  button.ghost {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    padding: 7px 13px; border-radius: 7px; cursor: pointer; font: inherit;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 9px; cursor: pointer; box-shadow: var(--shadow); position: relative;
  }
  .card.unreviewed { opacity: .58; }
  .card.unreviewed::after {
    content: "unreviewed"; position: absolute; top: 7px; right: 7px;
    font-size: 9px; text-transform: uppercase; letter-spacing: .05em;
    background: var(--accent-soft); color: var(--accent); padding: 2px 5px; border-radius: 4px;
  }
  .card.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card .shot {
    aspect-ratio: 1; display: grid; place-items: center; overflow: hidden;
    /* Checkerboard: a cutout on transparent needs something behind it or a
       white item reads as a hole in the page. */
    background-image:
      linear-gradient(45deg, var(--line) 25%, transparent 25%),
      linear-gradient(-45deg, var(--line) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--line) 75%),
      linear-gradient(-45deg, transparent 75%, var(--line) 75%);
    background-size: 14px 14px;
    background-position: 0 0, 0 7px, 7px -7px, -7px 0;
    border-radius: 7px;
  }
  .card .shot img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .card .nm { font-size: 12px; margin-top: 7px; font-weight: 550;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { font-size: 11px; color: var(--muted);
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .empty { padding: 48px 20px; text-align: center; color: var(--muted); }
  .empty strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 6px; }

  /* review queue */
  .review { display: grid; grid-template-columns: minmax(240px, 380px) 1fr; gap: 20px;
            background: var(--panel); border: 1px solid var(--line);
            border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  .review .shot { aspect-ratio: 1; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 4px 12px; }
  .field.flagged label { color: var(--accent); font-weight: 700; }
  .field.flagged input, .field.flagged select { border-color: var(--accent); background: var(--accent-soft); }
  .field .conf { font-size: 10px; color: var(--muted); float: right; text-transform: none; letter-spacing: 0; }
  .bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
  .bar span { display: block; height: 100%; background: var(--accent); transition: width .2s; }
  kbd { background: var(--bg); border: 1px solid var(--line); border-bottom-width: 2px;
        border-radius: 4px; padding: 1px 5px; font-size: 11px; font-family: ui-monospace, monospace; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  tr.picked { background: var(--accent-soft); }
  td img { height: 42px; width: 42px; object-fit: contain; }

  .gap { border-left: 3px solid var(--warn); background: var(--panel); border-radius: 7px;
         padding: 9px 12px; margin-bottom: 8px; border-top: 1px solid var(--line);
         border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .gap.optional { border-left-color: var(--muted); }
  .gap b { display: block; }
  .gap span { color: var(--muted); font-size: 12px; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
          background: var(--bg); border: 1px solid var(--line); color: var(--muted); margin-right: 4px; }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg); padding: 9px 18px; border-radius: 999px;
    opacity: 0; transition: .18s; pointer-events: none; z-index: 60; font-size: 13px;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  dialog {
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
    color: var(--ink); max-width: 820px; width: 92vw; padding: 0;
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .detail { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 20px; }
  .detail dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 13px; }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; }
  .bulkbar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
    border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 9px;
    align-items: center; z-index: 30;
  }
  @media (max-width: 760px) {
    .row { flex-direction: column; } .rail { width: 100%; flex: none; position: static; }
    .review { grid-template-columns: 1fr; } .detail { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Possessions</h1>
  <nav id="nav"></nav>
  <div id="stats"></div>
</header>
<main id="view"></main>
<div id="toast"></div>
<dialog id="detail"></dialog>

<script>
const TOKEN = "__LIFELOG_TOKEN__";
const BASE = "/possessions/api";

async function api(path, opts = {}) {
  const res = await fetch(BASE + path, {
    ...opts,
    headers: { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json",
               ...(opts.headers || {}) },
  });
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return res.status === 204 ? null : res.json();
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2200);
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (cents) => cents == null ? "—" : "$" + (cents / 100).toFixed(2);

let VOCAB = null, STATE = { tab: "review", selected: new Set() };

const TABS = [
  ["review",  "Review"],
  ["grid",    "Grid"],
  ["purge",   "Purge"],
  ["packing", "Packing"],
  ["places",  "Locations"],
];

function renderNav() {
  document.getElementById("nav").innerHTML = TABS.map(([id, label]) =>
    `<button data-tab="${id}" aria-current="${STATE.tab === id}">${label}</button>`).join("");
  document.querySelectorAll("nav button").forEach((b) =>
    b.onclick = () => go(b.dataset.tab));
}

async function refreshStats() {
  try {
    const s = await api("/stats");
    document.getElementById("stats").textContent =
      `${s.active} active · ${s.unreviewed} to review · ${s.purge_candidates} flagged to go`;
  } catch { /* header count is decoration; never block the page on it */ }
}

function go(tab) {
  STATE.tab = tab;
  STATE.selected = new Set();
  renderNav();
  ({ review: viewReview, grid: viewGrid, purge: viewPurge,
     packing: viewPacking, places: viewPlaces }[tab])();
}

function empty(title, next) {
  return `<div class="empty"><strong>${esc(title)}</strong>${esc(next)}</div>`;
}

function shot(item, alt) {
  const src = item.thumb_url || item.cutout_url;
  return `<div class="shot">${src
    ? `<img loading="lazy" src="${esc(src)}" alt="${esc(alt || item.name)}">`
    : `<span style="color:var(--muted);font-size:11px">no photo</span>`}</div>`;
}

/* ------------------------------------------------------------------ review */
/* The highest-leverage screen: one card at a time, Enter accepts, and Tab
   visits only the fields the tagger was unsure about. Everything else is
   reachable by mouse but stays out of the keyboard path — that gap is what
   makes 200 items in a sitting possible instead of one a minute.          */

let QUEUE = [], QI = 0, REVIEWED_THIS_SITTING = 0;

async function viewReview() {
  const view = document.getElementById("view");
  view.innerHTML = `<p style="color:var(--muted)">Loading the queue…</p>`;
  const data = await api("/review-queue?limit=200");
  QUEUE = data.items; QI = 0;
  if (!QUEUE.length) {
    view.innerHTML = empty("Nothing to review.",
      "Run `python -m possessions ingest <folder>` to add photos, then come back.");
    return;
  }
  drawCard();
}

function fieldHtml(name, value, conf, flagged, options) {
  const pct = conf == null ? "" : `<span class="conf">${Math.round(conf * 100)}%</span>`;
  const input = options
    ? `<select data-f="${name}" tabindex="${flagged ? 0 : -1}">` +
      `<option value=""></option>` +
      options.map((o) => `<option value="${esc(o)}" ${o === value ? "selected" : ""}>${esc(o)}</option>`).join("") +
      `</select>`
    : `<input type="text" data-f="${name}" value="${esc(value ?? "")}" tabindex="${flagged ? 0 : -1}">`;
  return `<div class="field ${flagged ? "flagged" : ""}">
      <label>${name.replace(/_/g, " ")}${pct}</label>${input}</div>`;
}

function drawCard() {
  const view = document.getElementById("view");
  if (QI >= QUEUE.length) {
    view.innerHTML = empty(`Queue clear — ${REVIEWED_THIS_SITTING} reviewed.`,
      "Open the Grid to see everything, or ingest another batch.");
    refreshStats();
    return;
  }
  const item = QUEUE[QI];
  const conf = item.tag_confidence || {};
  const threshold = VOCAB.review_threshold ?? 0.7;
  const isFlagged = (f) => conf[f] == null || conf[f] < threshold;
  const subOptions = (VOCAB.subcategories[item.kind] || []);
  const colors = VOCAB.colors.map((c) => c.name);

  view.innerHTML = `
    <div class="bar"><span style="width:${(QI / QUEUE.length) * 100}%"></span></div>
    <p style="color:var(--muted);margin:0 0 12px">
      Item ${QI + 1} of ${QUEUE.length} · <kbd>Enter</kbd> accept ·
      <kbd>Tab</kbd> next flagged field · <kbd>Esc</kbd> skip ·
      <kbd>⌘⌫</kbd> flag to purge
    </p>
    <div class="review" id="card">
      ${shot(item)}
      <div>
        <label>name</label>
        <input type="text" data-f="name" value="${esc(item.name)}" tabindex="0">
        <div class="fields" style="margin-top:10px">
          ${fieldHtml("kind", item.kind, conf.kind, isFlagged("kind"), VOCAB.kinds)}
          ${fieldHtml("subcategory", item.subcategory, conf.subcategory, isFlagged("subcategory"), subOptions)}
          ${fieldHtml("brand", item.brand, conf.brand, isFlagged("brand"))}
          ${fieldHtml("primary_color", item.primary_color, conf.primary_color, isFlagged("primary_color"), colors)}
          ${fieldHtml("secondary_color", item.secondary_color, conf.secondary_color, isFlagged("secondary_color"), colors)}
          ${fieldHtml("pattern", item.pattern, conf.pattern, isFlagged("pattern"), VOCAB.patterns)}
          ${fieldHtml("material", item.material, conf.material, isFlagged("material"))}
          ${fieldHtml("size", item.size, conf.size, isFlagged("size"))}
          ${fieldHtml("colorway", item.colorway, conf.colorway, isFlagged("colorway"))}
          ${fieldHtml("formality", item.formality, conf.formality, isFlagged("formality"), ["1","2","3","4","5"])}
          ${fieldHtml("warmth", item.warmth, conf.warmth, isFlagged("warmth"), ["1","2","3","4","5"])}
          ${fieldHtml("condition", item.condition, null, false, ["1","2","3","4","5"])}
        </div>
        <label style="margin-top:10px">weather tags</label>
        <div id="wtags">${VOCAB.weather_tags.map((t) => `
          <label class="pill" style="cursor:pointer;text-transform:none;letter-spacing:0;display:inline-block">
            <input type="checkbox" value="${t}" ${(item.weather_tags || []).includes(t) ? "checked" : ""}
                   tabindex="-1"> ${t}</label>`).join("")}</div>
        <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="action" id="accept">Accept</button>
          <button class="ghost" id="skip">Skip</button>
          <button class="ghost" id="purge">Flag to purge</button>
        </div>
      </div>
    </div>`;

  document.getElementById("accept").onclick = () => accept();
  document.getElementById("skip").onclick = () => { QI++; drawCard(); };
  document.getElementById("purge").onclick = () => accept("purge_candidate");

  // Land the caret on the first thing actually in question.
  const first = document.querySelector(".field.flagged input, .field.flagged select")
             || document.querySelector('[data-f="name"]');
  if (first) { first.focus(); if (first.select) first.select(); }
}

function collectPatch(item) {
  const patch = {};
  document.querySelectorAll("#card [data-f]").forEach((el) => {
    const key = el.dataset.f;
    let value = el.value === "" ? null : el.value;
    if (["formality", "warmth", "condition"].includes(key) && value != null) value = Number(value);
    const before = item[key] ?? null;
    if (value !== before) patch[key] = value;
  });
  const tags = [...document.querySelectorAll("#wtags input:checked")].map((i) => i.value);
  const beforeTags = (item.weather_tags || []).slice().sort().join(",");
  if (tags.slice().sort().join(",") !== beforeTags) patch.weather_tags = tags;
  return patch;
}

async function accept(status) {
  const item = QUEUE[QI];
  const patch = collectPatch(item);
  if (status) patch.status = status;
  try {
    await api(`/items/${item.id}/review`, {
      method: "POST", body: JSON.stringify({ patch, reviewed: true }),
    });
    REVIEWED_THIS_SITTING++;
    toast(status === "purge_candidate" ? "Flagged to purge." : "Accepted.");
    QI++; drawCard();
  } catch (e) { toast("Couldn't save: " + e.message); }
}

document.addEventListener("keydown", (e) => {
  if (STATE.tab !== "review" || QI >= QUEUE.length) return;
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "Enter") { e.preventDefault(); accept(); }
  else if (e.key === "Escape") { e.preventDefault(); QI++; drawCard(); }
  else if (e.key === "Backspace" && (e.metaKey || e.ctrlKey)) {
    e.preventDefault(); accept("purge_candidate");
  }
});

/* -------------------------------------------------------------------- grid */

async function viewGrid(filters = {}) {
  const view = document.getElementById("view");
  const qs = new URLSearchParams(
    Object.entries(filters).filter(([, v]) => v !== "" && v != null));
  if (!qs.has("status")) qs.set("status", filters.status ?? "active");
  qs.set("limit", "500");
  view.innerHTML = `<p style="color:var(--muted)">Loading…</p>`;
  const [data, places] = await Promise.all([
    api("/items?" + qs.toString()), api("/locations"),
  ]);

  view.innerHTML = `<div class="row">
    <aside class="rail">
      <h3>Kind</h3>
      <select id="f-kind"><option value="">Everything</option>
        ${VOCAB.kinds.map((k) => `<option ${filters.kind === k ? "selected" : ""}>${k}</option>`).join("")}</select>
      <h3>Colour</h3>
      <select id="f-color"><option value="">Any</option>
        ${VOCAB.colors.map((c) => `<option value="${c.name}" ${filters.primary_color === c.name ? "selected" : ""}>${c.name}</option>`).join("")}</select>
      <h3>Location</h3>
      <select id="f-loc"><option value="">Anywhere</option>
        ${places.locations.map((l) => `<option value="${esc(l.name)}" ${filters.location === l.name ? "selected" : ""}>${esc(l.full_path)}</option>`).join("")}</select>
      <h3>Status</h3>
      <select id="f-status">
        ${VOCAB.statuses.map((s) => `<option ${(filters.status ?? "active") === s ? "selected" : ""}>${s}</option>`).join("")}
        <option value="__all" ${filters.status === "__all" ? "selected" : ""}>everything</option>
      </select>
      <h3>Search</h3>
      <input type="text" id="f-search" value="${esc(filters.search || "")}" placeholder="name or brand">
      <div style="margin-top:14px"><button class="action" id="apply">Apply filters</button></div>
    </aside>
    <div class="grow">
      <p style="color:var(--muted);margin:0 0 10px">${data.count} item${data.count === 1 ? "" : "s"}</p>
      ${data.count ? `<div class="grid">${data.items.map(cardHtml).join("")}</div>`
        : empty("Nothing matches those filters.", "Widen the filters, or ingest a batch of photos.")}
    </div></div>`;

  const read = () => ({
    kind: document.getElementById("f-kind").value,
    primary_color: document.getElementById("f-color").value,
    location: document.getElementById("f-loc").value,
    status: document.getElementById("f-status").value === "__all" ? null
            : document.getElementById("f-status").value,
    search: document.getElementById("f-search").value,
  });
  document.getElementById("apply").onclick = () => viewGrid(read());
  document.getElementById("f-search").onkeydown = (e) => {
    if (e.key === "Enter") viewGrid(read());
  };
  wireCards();
}

function cardHtml(item) {
  return `<div class="card ${item.reviewed ? "" : "unreviewed"}" data-id="${item.id}">
    ${shot(item)}
    <div class="nm">${esc(item.name)}</div>
    <div class="sub">${esc(item.kind)}${item.brand ? " · " + esc(item.brand) : ""}</div>
  </div>`;
}

function wireCards() {
  document.querySelectorAll(".card").forEach((el) =>
    el.onclick = () => openDetail(el.dataset.id));
}

/* ------------------------------------------------------------------ detail */

async function openDetail(id) {
  const item = await api(`/items/${id}`);
  const dlg = document.getElementById("detail");
  const wears = item.wear_history || [];
  dlg.innerHTML = `<div class="detail">
      <div>
        ${shot(item)}
        ${item.original_url ? `<p style="margin-top:8px"><a href="${esc(item.original_url)}"
            target="_blank" rel="noopener" style="color:var(--accent)">Open the original photo</a></p>` : ""}
      </div>
      <div>
        <h2 style="margin:0 0 4px;font-size:18px">${esc(item.name)}</h2>
        <p style="color:var(--muted);margin:0 0 14px">
          ${esc(item.kind)}${item.subcategory ? " · " + esc(item.subcategory) : ""}
          ${item.reviewed ? "" : ' · <span style="color:var(--accent)">unreviewed</span>'}</p>
        <dl>
          <dt>Brand</dt><dd>${esc(item.brand || "—")}</dd>
          <dt>Colour</dt><dd>${esc(item.primary_color)}${item.secondary_color ? " / " + esc(item.secondary_color) : ""}</dd>
          <dt>Material</dt><dd>${esc(item.material || "—")}</dd>
          <dt>Size</dt><dd>${esc(item.size || "—")}</dd>
          <dt>Where</dt><dd>${esc(item.location_path || "not filed anywhere")}</dd>
          <dt>Status</dt><dd>${esc(item.status)}</dd>
          <dt>Cost</dt><dd>${money(item.cost_cents)}</dd>
          <dt>Cost per wear</dt><dd>${money(item.cost_per_wear_cents)}</dd>
          <dt>Worn</dt><dd>${item.wear_count_all}× total · ${item.wear_count_30} in 30d</dd>
          <dt>Last worn</dt><dd>${esc(item.last_worn_on || "never")}</dd>
        </dl>
        <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="action" id="d-wear">Log a wear today</button>
          <button class="ghost" id="d-purge">Flag to purge</button>
          <button class="ghost" id="d-close">Close</button>
        </div>
        <h3 style="font-size:11px;text-transform:uppercase;color:var(--muted);margin:18px 0 6px">
          Wear history</h3>
        ${wears.length
          ? `<div style="max-height:170px;overflow:auto"><table>${wears.map((w) =>
              `<tr><td>${esc(w.worn_on)}</td><td>${esc(w.context || "—")}</td>
                   <td>${esc(w.city || "")}</td></tr>`).join("")}</table></div>`
          : `<p style="color:var(--muted)">Never logged. Log a wear and cost per wear starts working.</p>`}
      </div></div>`;
  dlg.showModal();
  document.getElementById("d-close").onclick = () => dlg.close();
  document.getElementById("d-wear").onclick = async () => {
    await api("/wear", { method: "POST",
      body: JSON.stringify({ possession_ids: [item.id] }) });
    toast("Logged a wear for today."); dlg.close();
  };
  document.getElementById("d-purge").onclick = async () => {
    await api("/items/status", { method: "POST",
      body: JSON.stringify({ possession_ids: [item.id], status: "purge_candidate" }) });
    toast("Flagged to purge."); dlg.close(); refreshStats();
  };
}

/* ------------------------------------------------------------------- purge */

async function viewPurge(minDays = 180) {
  const view = document.getElementById("view");
  view.innerHTML = `<p style="color:var(--muted)">Loading…</p>`;
  const data = await api(`/purge?min_days_unworn=${minDays}`);
  view.innerHTML = `
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
      <label style="margin:0">Unworn for at least</label>
      <select id="p-days" style="width:auto">
        ${[90, 180, 365, 730].map((d) => `<option value="${d}" ${d === minDays ? "selected" : ""}>${d} days</option>`).join("")}
      </select>
      <span style="color:var(--muted)">${data.count} candidate${data.count === 1 ? "" : "s"}</span>
    </div>
    ${data.count ? `<table>
      <thead><tr><th></th><th></th><th>Item</th><th>Idle</th><th>Worn</th>
        <th>Cost/wear</th><th>Where</th></tr></thead>
      <tbody>${data.items.map((i) => `
        <tr data-id="${i.id}">
          <td><input type="checkbox" class="sel" value="${i.id}"></td>
          <td>${i.thumb_url ? `<img src="${esc(i.thumb_url)}" alt="">` : ""}</td>
          <td><a href="#" class="open" data-id="${i.id}" style="color:inherit">${esc(i.name)}</a>
              <div style="color:var(--muted);font-size:11px">${esc(i.kind)}${i.brand ? " · " + esc(i.brand) : ""}</div></td>
          <td>${i.days_idle ?? "?"}d</td>
          <td>${i.wear_count_all}×</td>
          <td>${money(i.cost_per_wear_cents)}</td>
          <td style="color:var(--muted)">${esc(i.location_path || "—")}</td>
        </tr>`).join("")}</tbody></table>`
      : empty("Nothing has been idle that long.",
              "Lower the threshold, or log some wears so the numbers mean something.")}
    <div class="bulkbar" id="bulk" style="display:none">
      <span id="bulk-n"></span>
      <button class="action" id="bulk-purge">Flag to purge</button>
      <button class="ghost" id="bulk-clear">Clear selection</button>
    </div>`;

  document.getElementById("p-days").onchange = (e) => viewPurge(Number(e.target.value));
  document.querySelectorAll(".open").forEach((a) =>
    a.onclick = (e) => { e.preventDefault(); openDetail(a.dataset.id); });

  const sync = () => {
    const chosen = [...document.querySelectorAll(".sel:checked")];
    document.getElementById("bulk").style.display = chosen.length ? "flex" : "none";
    document.getElementById("bulk-n").textContent =
      `${chosen.length} selected`;
    document.querySelectorAll("tbody tr").forEach((tr) =>
      tr.classList.toggle("picked", tr.querySelector(".sel")?.checked));
  };
  document.querySelectorAll(".sel").forEach((c) => c.onchange = sync);
  document.getElementById("bulk-clear").onclick = () => {
    document.querySelectorAll(".sel").forEach((c) => (c.checked = false)); sync();
  };
  document.getElementById("bulk-purge").onclick = async () => {
    const ids = [...document.querySelectorAll(".sel:checked")].map((c) => c.value);
    const result = await api("/items/status", { method: "POST",
      body: JSON.stringify({ possession_ids: ids, status: "purge_candidate" }) });
    toast(`Flagged ${result.updated} to purge.`);
    viewPurge(minDays); refreshStats();
  };
}

/* ----------------------------------------------------------------- packing */

async function viewPacking(tripId) {
  const view = document.getElementById("view");
  const { trips } = await api("/trips");
  if (!trips.length) {
    view.innerHTML = empty("No trips yet.",
      "Add one with create_trip from chat, or `python -m possessions add-trip`.");
    return;
  }
  const trip = trips.find((t) => t.id === tripId) || trips[0];
  view.innerHTML = `<p style="color:var(--muted)">Building the list…</p>`;
  const plan = await api(`/trips/${trip.id}/packing?persist=true`);

  const blocks = (trip.destinations || []).map((d) => `
    <span class="pill">${esc(d.city || "leg")}${d.from ? " " + esc(d.from) : ""}
      ${(d.weather_tags || []).map((t) => " · " + esc(t)).join("")}</span>`).join("");

  view.innerHTML = `
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap">
      <select id="t-pick" style="width:auto">
        ${trips.map((t) => `<option value="${t.id}" ${t.id === trip.id ? "selected" : ""}>
           ${esc(t.name)} · ${esc(t.start_date)}</option>`).join("")}</select>
      <span style="color:var(--muted)">${plan.profile.nights} nights ·
        ${plan.totals.item_count} items${plan.totals.weight_g
          ? " · " + (plan.totals.weight_g / 1000).toFixed(1) + " kg" : ""}</span>
    </div>
    <div style="margin-bottom:16px">${blocks}</div>
    ${plan.gaps.length ? `<h3 style="font-size:12px;text-transform:uppercase;color:var(--muted)">
        ${plan.totals.essential_gaps} to sort before you go</h3>
      ${plan.gaps.map((g) => `<div class="gap ${g.essential ? "" : "optional"}">
        <b>${esc(g.label)}</b><span>${esc(g.reason)} — ${esc(g.suggestion)}</span></div>`).join("")}`
      : `<div class="gap" style="border-left-color:var(--ok)"><b>Nothing missing.</b>
         <span>Every slot this trip needs is covered by something you own.</span></div>`}
    <div style="margin-top:20px">
      ${Object.entries(plan.by_kind).map(([kind, items]) => `
        <h3 style="font-size:12px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px">
          ${esc(kind)}</h3>
        <div class="grid">${items.map((i) => `
          <div class="card" data-pid="${i.id}">
            ${shot(i)}
            <div class="nm">${esc(i.name)}</div>
            <div class="sub">${esc((i.reasons || []).join(", "))}</div>
            <label style="margin-top:6px;text-transform:none;letter-spacing:0;color:var(--ink)">
              <input type="checkbox" class="packed" data-pid="${i.id}"> packed</label>
          </div>`).join("")}</div>`).join("")}
    </div>`;

  document.getElementById("t-pick").onchange = (e) => viewPacking(e.target.value);
  document.querySelectorAll(".packed").forEach((box) => {
    box.onchange = async () => {
      await api(`/trips/${trip.id}/packing/${box.dataset.pid}`, {
        method: "POST",
        body: JSON.stringify({ state: box.checked ? "packed" : "candidate" }),
      });
      toast(box.checked ? "Packed." : "Moved back to the shortlist.");
    };
  });
}

/* --------------------------------------------------------------- locations */

async function viewPlaces(name) {
  const view = document.getElementById("view");
  const { locations } = await api("/locations");
  if (!locations.length) {
    view.innerHTML = empty("No containers yet.",
      "Create one: python -m possessions add-location \"Bin A\" --kind bin");
    return;
  }
  const current = name || locations[0].name;
  const data = await api(`/locations/${encodeURIComponent(current)}/contents`);
  view.innerHTML = `<div class="row">
    <aside class="rail">
      <h3>Containers</h3>
      ${locations.map((l) => `<div style="padding:4px 0 4px ${(l.depth - 1) * 12}px">
        <a href="#" class="loc" data-name="${esc(l.name)}"
           style="color:${l.name === current ? "var(--accent)" : "inherit"};text-decoration:none">
          ${esc(l.name)}</a>
        <span style="color:var(--muted);font-size:11px"> ${l.active_item_count}</span>
      </div>`).join("")}
    </aside>
    <div class="grow">
      <h2 style="margin:0 0 4px;font-size:17px">${esc(data.location.full_path)}</h2>
      <p style="color:var(--muted);margin:0 0 14px">${data.item_count} item${data.item_count === 1 ? "" : "s"}
        ${data.children.length ? " · " + data.children.length + " container(s) inside" : ""}</p>
      ${data.item_count ? `<div class="grid">${data.items.map(cardHtml).join("")}</div>`
        : empty("This container is empty.",
                "Select items in the Grid and move them here, or say \"move these to " + current + "\" in chat.")}
    </div></div>`;
  document.querySelectorAll(".loc").forEach((a) =>
    a.onclick = (e) => { e.preventDefault(); viewPlaces(a.dataset.name); });
  wireCards();
}

/* -------------------------------------------------------------------- boot */

(async function boot() {
  try {
    VOCAB = await api("/vocab");
  } catch (e) {
    document.getElementById("view").innerHTML =
      empty("Couldn't reach the inventory.", e.message);
    return;
  }
  renderNav();
  refreshStats();
  const stats = await api("/stats").catch(() => ({ unreviewed: 0 }));
  go(stats.unreviewed ? "review" : "grid");
})();
</script>
</body>
</html>
